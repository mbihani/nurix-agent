[project]
name = "nurix-agent"
version = "0.1.0"
description = "Supervisor LangGraph agent for Genie-backed NL-to-viz"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.11.0",
    "databricks-sdk>=0.74.0",
    "langchain-mcp-adapters>=0.3.0",
    "mcp>=1.24.0,<2.0.0",
    "langgraph>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain>=0.3.0",
    "mlflow>=2.18.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
